name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Set permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single build job responsible for installing dependencies, configuring pages, and building with Vite
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect project root directory
        id: locate-root
        run: |
          if [ -f "package.json" ]; then
            TARGET_DIR="."
          else
            FOUND_FILE=$(find . -maxdepth 3 -not -path "*/node_modules/*" -name "package.json" | head -n 1)
            if [ -n "$FOUND_FILE" ]; then
              TARGET_DIR=$(dirname "$FOUND_FILE")
            else
              TARGET_DIR="."
            fi
          fi
          echo "dir=$TARGET_DIR" >> $GITHUB_OUTPUT
          if [ -f "$TARGET_DIR/package-lock.json" ]; then
            echo "lockfile=$TARGET_DIR/package-lock.json" >> $GITHUB_OUTPUT
            echo "has_lock=true" >> $GITHUB_OUTPUT
          else
            echo "has_lock=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js (with cache if lockfile exists)
        if: steps.locate-root.outputs.has_lock == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ${{ steps.locate-root.outputs.lockfile }}

      - name: Setup Node.js (without cache fallback)
        if: steps.locate-root.outputs.has_lock != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: ${{ steps.locate-root.outputs.dir }}
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Build static site with Vite
        working-directory: ${{ steps.locate-root.outputs.dir }}
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.locate-root.outputs.dir }}/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
